name: Backup

# Every Tuesday at 05:23 UTC (after the weekend matchday has closed),
# or by hand: Actions > Backup > Run workflow.
on:
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: quiniela-git
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Export the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m bot.backup export "$RUNNER_TEMP/backup.json"

      # The repository is public: the backup is stored encrypted with the BACKUP_KEY secret
      - name: Encrypt
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: |
          if [ -z "$BACKUP_KEY" ]; then
            echo "::error::Missing secret BACKUP_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p backups
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$RUNNER_TEMP/backup.json" -out backups/quiniela.json.enc -pass env:BACKUP_KEY
          rm -f "$RUNNER_TEMP/backup.json"

      - name: Commit to the repository
        run: |
          git config user.name "quiniela-bot"
          git config user.email "quiniela-bot@users.noreply.github.com"
          git add backups/quiniela.json.enc
          git commit -m "chore: weekly database backup $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
