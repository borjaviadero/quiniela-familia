name: Quiniela

on:
  schedule:
    # Horas en UTC. Viernes a lunes cada 20 min (partidos y resultados);
    # martes a jueves una vez por hora (publicación de la jornada y avisos).
    - cron: "7,27,47 * * * 5,6,0,1"
    - cron: "7 * * * 2,3,4"
  workflow_dispatch:
    inputs:
      accion:
        description: "Qué ejecutar"
        type: choice
        options: [tick, diagnostico-lae, telegram-ids]
        default: tick

concurrency:
  group: quiniela
  cancel-in-progress: false

permissions:
  contents: write   # solo para el commit de mantenimiento (ver último paso)

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fuentes Barlow Condensed para las imágenes
        run: |
          mkdir -p bot/fuentes
          for w in Bold SemiBold Medium; do
            curl -fsSL -o bot/fuentes/BarlowCondensed-$w.ttf \
              https://github.com/google/fonts/raw/main/ofl/barlowcondensed/BarlowCondensed-$w.ttf || true
          done

      - name: Ejecutar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: python -m bot.main ${{ inputs.accion || 'tick' }}

      # GitHub desactiva los cron de un repositorio sin commits en 60 días.
      # Si el último commit tiene más de 50 días, se hace uno vacío.
      - name: Mantener vivo el cron
        if: github.event_name == 'schedule'
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "quiniela-bot"
            git config user.email "quiniela-bot@users.noreply.github.com"
            git commit --allow-empty -m "Mantenimiento: mantener activas las tareas programadas"
            git push
          fi
